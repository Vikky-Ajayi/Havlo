<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Inspector</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    video {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #000;
    }
    .meta {
      position: absolute;
      left: 12px;
      top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      font-size: 16px;
      line-height: 1.3;
      white-space: pre-line;
      max-width: calc(100vw - 24px);
    }
    .status {
      position: absolute;
      right: 12px;
      top: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 165, 0, 0.88);
      color: #111;
      font-weight: 700;
      font-size: 14px;
    }
    body.ready .status {
      background: rgba(0, 200, 120, 0.92);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="video" muted playsinline preload="auto"></video>
    <div class="meta" id="meta">Preparing frame…</div>
    <div class="status" id="status">SEEKING</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const src = params.get('src') || '';
    const t = Number(params.get('t') || '0');
    const label = params.get('label') || '';
    const video = document.getElementById('video');
    const meta = document.getElementById('meta');
    const status = document.getElementById('status');

    const renderMeta = (duration = '') => {
      meta.textContent = `${label}\nTime: ${t.toFixed(2)}s${duration ? ` / ${duration}` : ''}\n${src}`;
    };

    const setReady = () => {
      document.body.classList.add('ready');
      status.textContent = 'READY';
      renderMeta(video.duration ? `${video.duration.toFixed(2)}s` : '');
    };

    video.src = src;
    renderMeta();

    video.addEventListener('loadedmetadata', () => {
      if (Number.isFinite(video.duration) && t <= video.duration) {
        video.currentTime = Math.max(0, t);
      } else {
        setReady();
      }
    });

    video.addEventListener('seeked', setReady, { once: true });
    video.addEventListener('error', () => {
      status.textContent = 'ERROR';
      meta.textContent = `Failed to load\n${src}`;
    });
  </script>
</body>
</html>
