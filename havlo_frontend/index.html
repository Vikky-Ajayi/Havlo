    <!-- Google tags: Google Ads and Analytics (gtag), and the Tag Manager
         container of the page that has one (/sell GTM-537H8B3L, /rm/...
         GTM-PF7GK3B9, /offer/... GTM-MF4FWMML, /buyabroad/listings
         GTM-WS22MXCM; the same IDs as src/lib/gtm.ts). Like the Meta Pixel
         below, they load only on heyhavlo.com and only once the visitor has
         accepted cookies (the banner, src/lib/consent.ts, calls
         havloLoadGoogleTags then). Until then the page's own events wait on
         the dataLayer and go out if they accept. The containers start from
         the gtag('js', ...) pushed here, so they aren't pushed again. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.havloTrackingHost = /^(www\.)?heyhavlo\.com$/.test(location.hostname);
      window.havloSellPage = /^\/sell\/?$/.test(location.pathname);
      window.havloRmPage = /^\/rm\//.test(location.pathname);
      window.havloOfferPage = /^\/offer(\/|$)/.test(location.pathname);
      window.havloGtmIdFor = function (path) {
        if (/^\/sell\/?$/.test(path)) return 'GTM-537H8B3L';
        if (/^\/rm\//.test(path)) return 'GTM-PF7GK3B9';
        if (/^\/offer(\/|$)/.test(path)) return 'GTM-MF4FWMML';
        if (/^\/buyabroad\/listings\/?$/.test(path)) return 'GTM-WS22MXCM';
        return null;
      };
      window.havloLoadScript = function (src) {
        if (document.querySelector('script[src="' + src + '"]')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = src;
        document.head.appendChild(s);
      };
      window.havloLoadGoogleTags = function () {
        if (!window.havloTrackingHost || window.havloGoogleLoaded) return;
        window.havloGoogleLoaded = true;
        gtag('consent', 'default', {ad_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted', analytics_storage: 'granted'});
        gtag('js', new Date());
        gtag('config', 'AW-17989602376');
        gtag('config', 'G-YZC82R78VZ');
        window.havloLoadScript('https://www.googletagmanager.com/gtag/js?id=AW-17989602376');
        var id = window.havloGtmIdFor(location.pathname);
        if (id) window.havloLoadScript('https://www.googletagmanager.com/gtm.js?id=' + id);
      };
      try {
        if (localStorage.getItem('havlo_cookie_consent') === 'granted') window.havloLoadGoogleTags();
      } catch (e) {}
    </script>
    <!-- Meta Pixel Code (every page but /sell, /rm/... and /offer/...).
         Only on heyhavlo.com itself (never a local or preview build, so test
         traffic stays out of the live data) and only once the visitor has
         accepted cookies (the banner, src/lib/consent.ts, calls
         havloLoadMetaPixel then). Page views after the first are the app's,
         one per page (src/lib/metaPixel.ts), so the pixel's own page view on
         every address change is switched off (disablePushState): a step
         change on the same page isn't another page view. The marketing
         team's tracking brief, Nov 2026. -->
    <script>
      window.havloMetaHost = window.havloTrackingHost;
      window.havloMetaPath = function (path) {
        return !/^\/sell\/?$/.test(path) && !/^\/rm\//.test(path) && !/^\/offer(\/|$)/.test(path);
      };
      window.havloLoadMetaPixel = function () {
        if (!window.havloMetaHost || !window.havloMetaPath(location.pathname) || window.fbq) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq.disablePushState = true;
        // Hashed contact details from the details form, for advanced matching
        // (src/lib/metaPixel.ts keeps them for this browser tab).
        var userData;
        try { userData = JSON.parse(sessionStorage.getItem('havlo_meta_am') || 'null') || undefined; } catch (e) {}
        fbq('init', '2204792573402043', userData);
        fbq('track', 'PageView');
      };
      try {
        if (localStorage.getItem('havlo_cookie_consent') === 'granted') window.havloLoadMetaPixel();
      } catch (e) {}
    </script>
